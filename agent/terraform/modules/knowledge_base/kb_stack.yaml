AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bedrock Knowledge Base with OpenSearch Serverless'

Parameters:
  ProjectName:
    Type: String
    Description: Project name for resource naming
  Environment:
    Type: String
    Description: Environment name
  KnowledgeBaseRoleArn:
    Type: String
    Description: IAM role ARN for Knowledge Base
  S3BucketArn:
    Type: String
    Description: S3 bucket ARN for documents
  InclusionPrefixes:
    Type: CommaDelimitedList
    Description: S3 prefixes to include
    Default: ""

Resources:
  # OpenSearch Serverless Encryption Policy
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${ProjectName}-kb-encryption-${Environment}'
      Type: encryption
      Policy: !Sub |
        {
          "Rules": [
            {
              "Resource": ["collection/${ProjectName}-kb-${Environment}"],
              "ResourceType": "collection"
            }
          ],
          "AWSOwnedKey": true
        }

  # OpenSearch Serverless Network Policy
  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub '${ProjectName}-kb-network-${Environment}'
      Type: network
      Policy: !Sub |
        [
          {
            "Rules": [
              {
                "Resource": ["collection/${ProjectName}-kb-${Environment}"],
                "ResourceType": "collection"
              }
            ],
            "AllowFromPublic": true
          }
        ]

  # OpenSearch Serverless Collection
  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - EncryptionPolicy
      - NetworkPolicy
    Properties:
      Name: !Sub '${ProjectName}-kb-${Environment}'
      Type: VECTORSEARCH
      Description: Knowledge Base vector store

  # Data Access Policy
  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    DependsOn: OpenSearchCollection
    Properties:
      Name: !Sub '${ProjectName}-kb-access-${Environment}'
      Type: data
      Policy: !Sub |
        [
          {
            "Rules": [
              {
                "Resource": ["collection/${ProjectName}-kb-${Environment}"],
                "Permission": [
                  "aoss:CreateCollectionItems",
                  "aoss:DeleteCollectionItems",
                  "aoss:UpdateCollectionItems",
                  "aoss:DescribeCollectionItems"
                ],
                "ResourceType": "collection"
              },
              {
                "Resource": ["index/${ProjectName}-kb-${Environment}/*"],
                "Permission": [
                  "aoss:CreateIndex",
                  "aoss:DeleteIndex",
                  "aoss:UpdateIndex",
                  "aoss:DescribeIndex",
                  "aoss:ReadDocument",
                  "aoss:WriteDocument"
                ],
                "ResourceType": "index"
              }
            ],
            "Principal": ["${KnowledgeBaseRoleArn}"]
          }
        ]

  # Bedrock Knowledge Base
  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: DataAccessPolicy
    Properties:
      Name: !Sub '${ProjectName}-kb-${Environment}'
      RoleArn: !Ref KnowledgeBaseRoleArn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
      StorageConfiguration:
        Type: OPENSEARCH_SERVERLESS
        OpensearchServerlessConfiguration:
          CollectionArn: !GetAtt OpenSearchCollection.Arn
          VectorIndexName: bedrock-knowledge-base-default-index
          FieldMapping:
            VectorField: bedrock-knowledge-base-default-vector
            TextField: AMAZON_BEDROCK_TEXT_CHUNK
            MetadataField: AMAZON_BEDROCK_METADATA

  # Data Source 1
  DataSource1:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: !Sub '${ProjectName}-kb-datasource-1-${Environment}'
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !Ref S3BucketArn
          InclusionPrefixes: !If
            - HasPrefixes
            - - !Select [0, !Ref InclusionPrefixes]
            - !Ref AWS::NoValue
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 20

  # Data Source 2 (if second prefix exists)
  DataSource2:
    Type: AWS::Bedrock::DataSource
    Condition: HasSecondPrefix
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: !Sub '${ProjectName}-kb-datasource-2-${Environment}'
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !Ref S3BucketArn
          InclusionPrefixes:
            - !Select [1, !Ref InclusionPrefixes]
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 300
            OverlapPercentage: 20

Conditions:
  HasPrefixes: !Not [!Equals [!Join ['', !Ref InclusionPrefixes], '']]
  HasSecondPrefix: !And
    - !Condition HasPrefixes
    - !Not [!Equals [!Select [1, !Ref InclusionPrefixes], '']]

Outputs:
  KnowledgeBaseId:
    Description: Knowledge Base ID
    Value: !Ref KnowledgeBase
  KnowledgeBaseArn:
    Description: Knowledge Base ARN
    Value: !GetAtt KnowledgeBase.KnowledgeBaseArn
  OpenSearchCollectionArn:
    Description: OpenSearch Collection ARN
    Value: !GetAtt OpenSearchCollection.Arn
  DataSource1Id:
    Description: Data Source 1 ID
    Value: !Ref DataSource1
  DataSource2Id:
    Description: Data Source 2 ID
    Value: !If [HasSecondPrefix, !Ref DataSource2, '']
